<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2a1a">
<title>Analogital Pocket</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">

  <!-- 画面1：ホーム -->
  <section id="home" class="screen is-active">
    <div class="home-inner">
      <div class="brand">
        <img class="brand-mark" src="./icon-192.png" alt="" width="72" height="72">
        <h1 class="brand-name">Analogital Pocket</h1>
        <p class="brand-tag">写真を選んで、ワンタッチで色を変える。</p>
      </div>
      <button id="pickBtn" class="btn btn-primary">写真を選ぶ</button>
      <p class="note">写真は端末の外に送られません。すべてこの画面の中だけで処理します。</p>
    </div>
  </section>

  <!-- 画面2：編集 -->
  <section id="editor" class="screen">
    <header class="bar">
      <button id="backBtn" class="btn-icon" aria-label="別の写真を選ぶ">‹ 戻る</button>
      <span class="bar-title">編集</span>
      <span class="bar-spacer"></span>
    </header>
    <div class="preview-wrap">
      <canvas id="preview" class="preview"></canvas>
      <div id="busy" class="busy" hidden>処理中…</div>
    </div>
    <div class="controls">
      <div id="normalControls">
        <div id="recipes" class="recipes" role="group" aria-label="レシピを選ぶ"></div>
        <label class="slider-row">
          <span class="slider-label">明るさ</span>
          <input id="exposure" type="range" min="-100" max="100" value="0" aria-label="明るさ">
          <button id="expReset" class="btn-tiny" type="button">0</button>
        </label>
        <div class="row2">
          <button id="cropBtn" class="btn-sub" type="button">トリミング</button>
          <button id="saveBtn" class="btn btn-primary" type="button">保存する</button>
        </div>
      </div>
      <div id="cropControls" hidden>
        <div class="crop-row">
          <div id="ratios" class="ratios" role="group" aria-label="比率">
            <button class="ratio-chip is-on" data-ratio="free" type="button">自由</button>
            <button class="ratio-chip" data-ratio="1:1" type="button">1:1</button>
            <button class="ratio-chip" data-ratio="4:5" type="button">4:5</button>
            <button class="ratio-chip" data-ratio="16:9" type="button">16:9</button>
          </div>
          <button id="swapOrient" class="btn-icon2" type="button" aria-label="縦横を入れ替え" title="縦横を入れ替え">⇅</button>
        </div>
        <label class="slider-row">
          <span class="slider-label">角度</span>
          <input id="angle" type="range" min="-45" max="45" step="0.5" value="0" aria-label="角度">
          <button id="angleReset" class="btn-tiny" type="button">0</button>
        </label>
        <div class="row2">
          <button id="cropCancel" class="btn-sub" type="button">キャンセル</button>
          <button id="cropApply" class="btn btn-primary" type="button">適用</button>
        </div>
      </div>
      <p id="status" class="status" role="status"></p>
    </div>
  </section>

</div>

<input id="fileInput" type="file" accept="image/*" hidden>
<script src="./recipes-data.js"></script>
<script src="./app.js"></script>
</body>
</html>
